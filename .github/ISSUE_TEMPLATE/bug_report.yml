name: Bug report
description: Report a reproducible TFTMAC native-app or runtime problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve TFTMAC. Remove account names, credentials, tokens, and other private data before attaching logs.
  - type: input
    id: build
    attributes:
      label: TFTMAC commit or build
      placeholder: commit SHA or build identifier
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: mac-model
    attributes:
      label: Mac model and Apple chip
      placeholder: Mac mini, Apple M4
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Android Emulator version
      placeholder: 37.1.11
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open TFTMAC
        2. Perform the action
        3. Observe the result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Include only the bounded excerpt needed to show the failure.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, account identifiers, tokens, and raw sensitive data.
          required: true
