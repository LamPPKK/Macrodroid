# SwiftLint configuration for Macrodroid

included:
  - Macrodroid
  - Tests

excluded:
  - Generated
  - Vendor
  - .build

disabled_rules:
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - line_length
  - large_tuple
  - function_parameter_count
  - multiple_closures_with_trailing_closure
  - optional_data_string_conversion
  - implicit_optional_initialization
  - for_where
  - control_statement
  - statement_position
  - unused_optional_binding
  - unneeded_synthesized_initializer

identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 60
  excluded:
    - id
    - x
    - y
    - to
    - ok
    - up
    - cb
    - ch
    - vm
    - pb
    - fp
    - ms
    - hz
    - q
    - r
